apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: kube-gateway
      namespace: envoy-gateway
      sectionName: https-git
  hostnames:
    - "git.lxft.dev"
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000
