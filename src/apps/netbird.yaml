apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-netbird
  namespace: flux-system
spec:
  interval: 10m
  wait: true
  timeout: 5m
  path: ./src/apps/netbird
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-envoy-config
    - name: infra-cnpg
    - name: apps-authelia
  decryption:
    provider: sops
    secretRef:
      name: sops-age
