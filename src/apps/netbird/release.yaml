apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
  namespace: netbird
spec:
  interval: 1h
  chart:
    spec:
      chart: netbird
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: netbird
        namespace: flux-system
  install:
    createNamespace: true
  values:
    ingress:
      enabled: false
    dashboard:
      ingress:
        enabled: false

    # Configure NetBird to use PostgreSQL instead of SQLite
    netbird:
      store:
        engine: postgres

    # Pass the CNPG auto-generated Secret to the NetBird server containers
    envFrom:
      - secretRef:
          name: netbird-db-app
    env:
      - name: NETBIRD_STORE_ENGINE
        value: "postgres"
      - name: NETBIRD_STORE_DSN
        # CNPG populates the 'uri' key in the generated secret
        valueFrom:
          secretKeyRef:
            name: netbird-db-app
            key: uri
