apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
  namespace: netbird
spec:
  interval: 1h
  chart:
    spec:
      chart: netbird
      version: "1.9.0"
      sourceRef:
        kind: HelmRepository
        name: netbird
        namespace: flux-system
  install:
    createNamespace: true
  values:
    ingress:
      enabled: false

    dashboard:
      ingress:
        enabled: false
      image:
        tag: "v2.90.10"

    management:
      image:
        tag: "0.76.3"

    signal:
      image:
        tag: "0.76.3"

    relay:
      image:
        tag: "0.76.3"

    netbird:
      store:
        engine: postgres

    envFrom:
      - secretRef:
          name: netbird-db-app
    env:
      - name: NETBIRD_STORE_ENGINE
        value: "postgres"
      - name: NETBIRD_STORE_DSN
        valueFrom:
          secretKeyRef:
            name: netbird-db-app
            key: uri
