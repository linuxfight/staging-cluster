apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird
  namespace: netbird
spec:
  interval: 1h
  chart:
    spec:
      chart: netbird
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system

  valuesFrom:
    - kind: Secret
      name: netbird-secrets
      valuesKey: authSecret
      targetPath: server.authSecret
      optional: false
    - kind: Secret
      name: netbird-secrets
      valuesKey: ownerEmail
      targetPath: server.auth.owner.email
      optional: false
    - kind: Secret
      name: netbird-secrets
      valuesKey: ownerPassword
      targetPath: server.auth.owner.password
      optional: false

  values:
    server:
      publicUrl: https://cloud.lxft.dev
      disableAnonymousMetrics: true
      disableGeoliteUpdate: true
      image:
        tag: "0.77.0"
      auth:
        issuer: https://cloud.lxft.dev/oauth2
        localAuthDisabled: false
      service:
        type: ClusterIP

    dashboard:
      enabled: true
      image:
        tag: "v2.91.1"

    postgresql:
      enabled: false

    database:
      mode: external
      external:
        engine: postgres
        host: netbird-cnpg-rw.netbird.svc.cluster.local
        port: 5432
        name: netbird
        username: netbird
        existingSecret: netbird-cnpg-app
        existingSecretPasswordKey: password
        sslMode: require

    gatewayAPI:
      enabled: false

    extraManifests:
      # 1. Create an h2c Service for gRPC (Replicates Traefik's netbird-server-h2c)
      # NGF strictly requires appProtocol: kubernetes.io/h2c to speak HTTP/2 to the backend.
      - apiVersion: v1
        kind: Service
        metadata:
          name: netbird-server-h2c
        spec:
          # IMPORTANT: Verify these selectors match your actual netbird-server pods!
          selector:
            app.kubernetes.io/name: netbird
            app.kubernetes.io/component: server
          ports:
            - name: grpc
              port: 80
              targetPort: 80
              appProtocol: kubernetes.io/h2c

      # 2. GRPCRoute: gRPC Paths (Forces HTTP/2 via the h2c Service)
      - apiVersion: gateway.networking.k8s.io/v1
        kind: GRPCRoute
        metadata:
          name: netbird-server-grpc
        spec:
          parentRefs:
            - name: kube-gateway
              namespace: nginx-gateway
              sectionName: https-netbird
          hostnames: ["cloud.lxft.dev"]
          rules:
            - matches:
                - method:
                    service: management.ManagementService
              backendRefs:
                - name: netbird-server-h2c
                  port: 80
            - matches:
                - method:
                    service: signalexchange.SignalExchange
              backendRefs:
                - name: netbird-server-h2c
                  port: 80

      # 3. HTTPRoute: Backend / REST / OIDC Paths (Uses standard HTTP/1.1 Service)
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: netbird-server-http
        spec:
          parentRefs:
            - name: kube-gateway
              namespace: nginx-gateway
              sectionName: https-netbird
          hostnames: ["cloud.lxft.dev"]
          rules:
            - matches:
                - path: { type: PathPrefix, value: /relay }
                - path: { type: PathPrefix, value: /ws-proxy/ }
                - path: { type: PathPrefix, value: /api }
                - path: { type: PathPrefix, value: /oauth2 }
                # CRUCIAL for OIDC: Allows the dashboard to fetch the discovery document
                - path: { type: PathPrefix, value: /.well-known }
              backendRefs:
                - name: netbird-server
                  port: 80

      # 4. HTTPRoute: Dashboard Catch-All
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: netbird-dashboard
        spec:
          parentRefs:
            - name: kube-gateway
              namespace: nginx-gateway
              sectionName: https-netbird
          hostnames: ["cloud.lxft.dev"]
          rules:
            - matches:
                - path: { type: PathPrefix, value: / }
              backendRefs:
                - name: netbird-dashboard
                  port: 80

      # 5. UDPRoute: STUN (Unchanged)
      - apiVersion: gateway.networking.k8s.io/v1alpha2
        kind: UDPRoute
        metadata:
          name: netbird-stun
        spec:
          parentRefs:
            - name: kube-gateway
              namespace: nginx-gateway
              sectionName: stun-netbird
          rules:
            - backendRefs:
                - name: netbird-server
                  port: 3478
