apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 1h
  chart:
    spec:
      chart: vaultwarden
      version: 0.46.3
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    domain: "https://pass.lxft.dev"

    database:
      type: postgresql
      existingSecret: vaultwarden-cnpg-app
      existingSecretKey: uri

    storage:
      data:
        name: vaultwarden-data
        size: 1Gi
        class: local-path
        path: /data
        keepPvc: true
        accessMode: ReadWriteOnce

    vaultwarden:
      allowSignups: false
      allowInvitation: false
      verifySignup: false
      requireEmail: false
      smtp:
        host: ""
      admin:
        enabled: false

    sso:
      enabled: true
      onlySSO: true
      enforceSSO: true
      ignoreEmailVerification: true
      authority: "https://id.lxft.dev"
      scopes: "profile email offline_access vaultwarden"
      pkce: true
      existingSecret: vaultwarden-oidc
      clientId:
        existingSecretKey: clientId
      clientSecret:
        existingSecretKey: clientSecret

    ingress:
      enabled: false
