apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray
  namespace: xtls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xray
  template:
    metadata:
      labels:
        app: xray
    spec:
      containers:
      - name: xray
        image: ghcr.io/xtls/xray-core:latest
        command: ["xray"]
        args: ["run", "-c", "/etc/xray/config.json"]
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/xray
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: xray-config
