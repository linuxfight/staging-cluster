apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: flux-operator
  chart:
    spec:
      chart: flux-operator
      version: "0.60.0"
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
      interval: 30m
  values:
    web:
      enabled: true
      config:
        baseURL: https://cloud.lxft.dev/
