apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-envoy
  namespace: flux-system
spec:
  interval: 1h
  wait: true
  timeout: 5m
  path: ./src/infra/releases/envoy
  prune: false
  dependsOn:
    - name: infra-registry-creds
  sourceRef:
    kind: GitRepository
    name: flux-system
