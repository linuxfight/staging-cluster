apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-registry-creds
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  wait: true
  path: ./src/infra/configs/registry-creds
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
