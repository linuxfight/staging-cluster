apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  interval: 1h
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: "2.6.7"
      sourceRef:
        kind: HelmRepository
        name: nginx-gateway-fabric
        namespace: flux-system
  values:
    service:
      type: LoadBalancer
    nginxGateway:
      gatewayClassName: nginx
      gwAPIExperimentalFeatures:
        enable: true
    nginx:
      config:
        http2: true
